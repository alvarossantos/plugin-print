# Manifesto do plugin "Print Toolkit" para Noctalia v5.
# Confirmado contra docs.noctalia.dev/v5/plugins/development/ e contra
# os plugins reais materializados localmente:
#   ~/.local/state/noctalia/plugins/materialized/community/{audio-switcher,wl-screen-mirror}
#   ~/.local/state/noctalia/plugins/materialized/official/screen_recorder

id         = "alvaro/print-toolkit"
name       = "Print Toolkit"
version    = "0.1.1"
plugin_api = 9          # ui closures em callbacks (doc plugin-api nível 9, v5.0.0-beta.5)
author     = "alvaro"
license    = "MIT"
icon       = "screenshot"
description = "Screenshot (região/tela cheia), OCR, pesquisa reversa por imagem e gravação de tela em um único painel."
tags       = ["utility", "screenshot", "ocr", "recording", "productivity"]
dependencies = ["tesseract", "grim", "slurp", "curl"]

# ── Settings de plugin (lidas via noctalia.getConfig) ──────────────────────
[[setting]]
key           = "screenshot_dir"
type          = "folder"
label_key     = "settings.screenshot_dir.label"
description_key = "settings.screenshot_dir.description"
default       = "~/Pictures"

[[setting]]
key           = "ocr_language"
type          = "string"
label_key     = "settings.ocr_language.label"
description_key = "settings.ocr_language.description"
default       = "por+eng"

[[setting]]
key           = "search_engine"
type          = "select"
label_key     = "settings.search_engine.label"
description_key = "settings.search_engine.description"
default       = "google"
options       = [
  { value = "google", label_key = "settings.search_engine.google" },
  { value = "bing",   label_key = "settings.search_engine.bing" },
  { value = "yandex", label_key = "settings.search_engine.yandex" },
]

[[setting]]
key           = "record_source"
type          = "select"
label_key     = "settings.record_source.label"
description_key = "settings.record_source.description"
default       = "focused"
options       = [
  { value = "focused", label_key = "settings.record_source.focused" },
  { value = "portal",  label_key = "settings.record_source.portal" },
]

# ── Bar widget: ícone que abre o painel ─────────────────────────────────────
[[widget]]
id    = "toolkit"
entry = "widget.luau"

# ── Bar widget: status de gravação (ícone vermelho quando gravando) ──────────
[[widget]]
# ── Painel com as ações ─────────────────────────────────────────────────────
[[panel]]
id    = "tools"
entry = "panel.luau"
width = 420
height = 420
placement = "floating"
position  = "auto"
open_near_click = true

# ── Toolbar de captura (tecla Print), estilo iNiR ──────────────────────────
# Barra horizontal compacta na base da tela. Aberta via:
#   noctalia msg panel-toggle alvaro/print-toolkit:capture
[[panel]]
id    = "capture"
entry = "capture.luau"
width = 620
height = 68
placement = "floating"
position  = "bottom_center"
open_near_click = false

# ── Painel de gravação (overlay estilo iNiR) ────────────────────────────────
# Abre automaticamente ao iniciar gravação, mostra tempo + botões Pausar/Parar/Cancelar
[[panel]]
id    = "record"
entry = "scripts/record-panel.luau"
width = 340
height = 260
placement = "floating"
position  = "center"
open_near_click = false
